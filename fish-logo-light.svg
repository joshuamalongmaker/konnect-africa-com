<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 110" role="img" aria-labelledby="title description">
  <title id="title">Konnect Africa fish logo</title>
  <desc id="description">A silver and olive-gray Nile perch swimming above flowing water beside the Konnect Africa name.</desc>
  <defs>
    <linearGradient id="fish-silver" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#d8d5c6"/>
      <stop offset=".48" stop-color="#a5a99f"/>
      <stop offset="1" stop-color="#58636a"/>
    </linearGradient>
    <style>
      .swimmer { animation: swim 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .tail { animation: tail 650ms ease-in-out infinite alternate; transform-box: view-box; transform-origin: 43px 54px; }
      .water { animation: water 3.6s ease-in-out infinite; }
      .bubble { animation: bubble 2.2s ease-in-out infinite; transform-box: view-box; transform-origin: center; }
      .bubble-delay { animation-delay: 1.1s; }
      @keyframes swim { 0%, 100% { transform: translateY(1px); } 50% { transform: translateY(-2px); } }
      @keyframes tail { from { transform: rotate(-5deg); } to { transform: rotate(5deg); } }
      @keyframes water { 0%, 100% { opacity: .48; transform: translateX(0); } 50% { opacity: .9; transform: translateX(3px); } }
      @keyframes bubble { 0%, 100% { opacity: .25; transform: translateY(2px); } 50% { opacity: .9; transform: translateY(-2px); } }
      @media (prefers-reduced-motion: reduce) {
        .swimmer, .tail, .water, .bubble { animation: none; }
      }
    </style>
  </defs>
  <g class="water" fill="none" stroke="#f06478" stroke-linecap="round" stroke-width="2">
    <path d="M12 98c9-4 18-4 27 0s18 4 27 0 18-4 27 0 18 4 27 0 18-4 27 0"/>
    <path d="M27 104c7-3 14-3 21 0s14 3 21 0 14-3 21 0 14 3 21 0 14-3 21 0" opacity=".55"/>
  </g>
  <g class="swimmer">
    <path class="tail" d="M44 54 12 30 18 54 12 78Z" fill="url(#fish-silver)"/>
    <path d="M38 54c13-19 38-31 66-31 21 0 37 8 48 23l8 8-8 8c-11 15-27 23-48 23-28 0-53-12-66-31Z" fill="url(#fish-silver)"/>
    <path d="M64 37 72 24l6 10 7-18 7 11 8-15 7 16 9-10 4 17c-17-5-38-4-56 2Z" fill="#515b61"/>
    <path d="m75 81 17 16 17-15c-12 3-23 3-34-1Z" fill="#626b6d"/>
    <path d="M123 39c-2 7-6 12-12 15 6 3 10 8 12 15" fill="none" stroke="#596166" stroke-linecap="round" stroke-width="2.5"/>
    <path d="M51 62c21-3 46-2 70 3" fill="none" stroke="#e5e0d1" stroke-linecap="round" stroke-width="1.5" opacity=".75"/>
    <g fill="#596166" opacity=".42">
      <circle cx="61" cy="48" r="1.5"/><circle cx="70" cy="44" r="1.3"/><circle cx="80" cy="41" r="1.4"/>
      <circle cx="90" cy="39" r="1.3"/><circle cx="100" cy="40" r="1.4"/><circle cx="109" cy="43" r="1.3"/>
      <circle cx="66" cy="68" r="1.3"/><circle cx="77" cy="70" r="1.4"/><circle cx="88" cy="72" r="1.3"/>
      <circle cx="99" cy="72" r="1.4"/><circle cx="109" cy="69" r="1.3"/>
    </g>
    <path d="M55 51c18-10 42-14 65-10" fill="none" stroke="#eee9dc" stroke-linecap="round" stroke-width="2" opacity=".75"/>
    <circle cx="137" cy="45" r="4" fill="#fff"/>
    <circle cx="138" cy="45" r="1.8" fill="#171717"/>
  </g>
  <g fill="none" stroke="#f06478" stroke-width="1.8">
    <circle class="bubble" cx="151" cy="37" r="3"/>
    <circle class="bubble bubble-delay" cx="158" cy="48" r="2"/>
  </g>
  <text x="177" y="59" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="800" letter-spacing="2">KONNECT</text>
  <text x="179" y="87" fill="#f06478" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="8">AFRICA</text>
</svg>
