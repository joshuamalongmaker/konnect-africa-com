<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Konnect Africa</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="site-redesign.css">
  <style>
    body { min-height: 100vh; background: #f7f5f5; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', Arial, sans-serif; }
    .login-container { background: #fff; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,0.07); padding: 32px 24px; max-width: 370px; width: 100%; margin: 32px auto; animation: fadeInUp 0.8s cubic-bezier(.23,1.01,.32,1) both; }
    .login-logo { display: block; margin: 0 auto 18px auto; height: 48px; width: auto; }
    .login-title { text-align: center; font-size: 1.6rem; font-weight: 700; color: #222; margin-bottom: 24px; }
    .login-form label { display: block; font-size: 1rem; font-weight: 500; color: #222; margin-bottom: 6px; }
    .login-form input { width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; margin-bottom: 16px; background: #fff; transition: border-color 0.3s; }
    .login-form input:focus { border-color: #c91f3a; outline: none; }
    .login-form button { width: 100%; padding: 10px 0; background: #c91f3a; color: #fff; border: none; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.3s; }
    .login-form button:hover { background: #a3172e; }
    .login-form .signup { text-align: center; margin-top: 20px; font-size: 0.98em; color: #555; }
    .login-form .signup a { color: #c91f3a; font-weight: 600; text-decoration: none; transition: color 0.2s; }
    .login-form .signup a:hover { color: #a3172e; }
    @media (max-width: 480px) { .login-container { padding: 18px 4vw; max-width: 98vw; } .login-title { font-size: 1.1rem; } }
    @keyframes fadeInUp { 0% { opacity: 0; transform: translateY(40px); } 100% { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div class="login-container">
    <img src="fish-logo.svg" alt="Konnect Africa fish logo" class="login-logo" />
    <div class="login-title">Create your account</div>
    <form class="login-form" id="register-form" action="#" method="POST">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" maxlength="254" required autocomplete="email" placeholder="Enter your email" />
      <label for="password">Password</label>
      <div style="position:relative;">
        <input id="password" name="password" type="password" minlength="12" maxlength="72" required autocomplete="new-password" placeholder="Use at least 12 characters" style="padding-right:48px; width:100%; box-sizing:border-box;" />
        <button type="button" id="toggle-password" aria-pressed="false" style="position:absolute; right:8px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; font-size:1em; padding:0 6px; height:28px; line-height:1; z-index:2;">Show</button>
      </div>
      <button type="submit">Register</button>
      <div class="signup">
        Already have an account? <a href="login.html">Sign in</a>
      </div>
      <div id="register-error" style="color:#d00; text-align:center; margin-top:10px; display:none;"></div>
    </form>
    <script src="auth.js" defer></script>
  </div>
</body>
</html>
